<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Shooter: Step 9 (Fixes)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        canvas {
            display: block;
        }

        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.7);
            pointer-events: none;
        }

        #ammo-ui {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: rgba(255, 255, 255, 0.6);
            font-family: monospace;
            font-size: 1.2em;
            text-align: right;
            pointer-events: none;
        }

        #hull-ui {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.4);
            font-family: monospace;
            font-size: 1em;
            text-align: center;
            pointer-events: none;
        }

        .key-hint {
            display: inline-block;
            background: rgba(68, 68, 68, 0.7);
            padding: 2px 6px;
            border-radius: 4px;
            margin: 0 2px;
            font-family: monospace;
            font-size: 0.9em;
        }

        .cooldown-bar {
            width: 100px;
            height: 4px;
            background: #444;
            margin-top: 5px;
            display: inline-block;
        }

        .cooldown-fill {
            height: 100%;
            background: #00ffff;
            width: 100%;
            transition: width 0.1s;
        }

        .alert {
            color: #ff3333;
            font-weight: bold;
            display: none;
        }

        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ff3333;
            z-index: 100;
        }

        #game-over-screen h1 {
            font-size: 4em;
            margin: 0 0 20px 0;
            text-shadow: 0 0 20px #ff0000;
            font-family: 'Segoe UI', sans-serif;
            text-transform: uppercase;
            letter-spacing: 5px;
        }

        #restart-btn {
            background: rgba(255, 0, 0, 0.2);
            border: 2px solid #ff3333;
            color: #ff3333;
            padding: 15px 40px;
            font-size: 1.5em;
            cursor: pointer;
            font-family: monospace;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        #restart-btn:hover {
            background: #ff3333;
            color: black;
            box-shadow: 0 0 20px #ff0000;
        }
    </style>
    </style>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        #setup-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }

        .setup-btn {
            background: rgba(0, 255, 255, 0.2);
            border: 2px solid #00ffff;
            color: #00ffff;
            padding: 15px 40px;
            font-size: 1.5em;
            cursor: pointer;
            font-family: monospace;
            margin: 10px;
            text-transform: uppercase;
            width: 300px;
        }

        .setup-btn:hover {
            background: #00ffff;
            color: black;
        }

        #room-id-input {
            padding: 15px;
            font-size: 1.2em;
            background: #222;
            border: 2px solid #555;
            color: white;
            font-family: monospace;
            margin-bottom: 20px;
            width: 270px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div id="game-over-screen">
        <h1>Mission Failed</h1>
        <p style="color: white; margin-bottom: 30px; font-family: monospace; font-size: 1.2em;">HULL INTEGRITY CRITICAL
        </p>
        <button id="restart-btn" onclick="location.reload()">RESTART MISSION</button>
    </div>

    <div id="setup-screen">
        <h1 style="color: white; font-family: 'Segoe UI'; font-weight: 300; letter-spacing: 5px;">MULTIPLAYER SETUP</h1>
        <input type="text" id="room-id-input" placeholder="ENTER ROOM ID / NAME" value="ROOM1">
        <button class="setup-btn" onclick="startHost()">HOST GAME</button>
        <button class="setup-btn" onclick="joinGame()">JOIN GAME</button>
        <p id="net-status" style="color: #666; font-family: monospace; margin-top: 20px;">NOT CONNECTED</p>
    </div>

    <div id="ui-layer">
        <h1>Space Shooter</h1>
        <p><strong>Move:</strong> <span class="key-hint">Numpad</span></p>
        <p><strong>Front Torpedo:</strong> <span class="key-hint">Shift</span></p>
        <p><strong>Rear Torpedo:</strong> <span class="key-hint">Ctrl</span></p>
        <p><strong>Laser:</strong> <span class="key-hint">Space</span> (10s CD)</p>
        <div id="laser-cd-container">
            Laser Ready: <div class="cooldown-bar">
                <div id="laser-bar" class="cooldown-fill"></div>
            </div>
        </div>
        <p>Enemies: <span id="enemy-count">0</span> / 6</p>
        <p id="alert-msg" class="alert">SYSTEM FAILURE</p>
    </div>

    <div id="hull-ui">
        HULL INTEGRITY: <span id="hull-val">100</span>%
    </div>

    <div id="ammo-ui">
        <div>TORP FWD: <span id="ammo-fwd">12</span></div>
        <div>TORP AFT: <span id="ammo-aft">05</span></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        // --- Constants & Config ---
        const MOVEMENT_SPEED = 100;
        const ROTATION_SPEED = 360;
        const TORPEDO_SPEED = 300;
        const STAR_COUNT = 200;

        const ENEMY_MAX_COUNT = 6;
        const ENEMY_SPAWN_RATE = 2000;
        const ENEMY_PROJECTILE_SPEED = 200;

        const SHIELD_RADIUS = 60;
        const SHIELD_DECAY = 2.0;

        // --- Canvas Setup ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const countDisplay = document.getElementById('enemy-count');

        // Multiplayer Globals
        let networkMode = 'OFFLINE'; // 'HOST', 'CLIENT', 'OFFLINE'
        let socket = null;
        let roomId = null;
        let remotePlayer = null; // { x, y, angle, hull, id }
        let isMultiplayer = false;
        let playerId = 'PLAYER_' + Math.floor(Math.random() * 10000);
        let remoteShipImages = []; // Filled on exchange

        // Setup UI
        const setupScreen = document.getElementById('setup-screen');
        const netStatus = document.getElementById('net-status');
        const roomIdInput = document.getElementById('room-id-input');

        function initSocket() {
            if (typeof io === 'undefined') {
                netStatus.innerText = "SOCKET.IO NOT FOUND (Run node server.js)";
                return false;
            }
            if (!socket) {
                socket = io();

                socket.on('error_msg', (msg) => { alert("Error: " + msg); });

                socket.on('hosting_started', (rid) => {
                    networkMode = 'HOST';
                    isMultiplayer = true;
                    roomId = rid;
                    setupScreen.style.display = 'none';
                    netStatus.innerText = "HOSTING ROOM: " + rid;
                    console.log("Hosting " + rid);
                });

                socket.on('connected_to_host', (rid) => {
                    networkMode = 'CLIENT';
                    isMultiplayer = true;
                    roomId = rid;
                    setupScreen.style.display = 'none';
                    netStatus.innerText = "CONNECTED TO: " + rid;
                    console.log("Connected " + rid);

                    // Send Client Hello (Screen Size)
                    socket.emit('client_hello', { w: window.innerWidth, h: window.innerHeight, pid: playerId });

                    // Send My Sprites
                    shareSprites('PLAYER', playerId, shipImages);
                });

                socket.on('client_connected', (clientId) => {
                    console.log("Client connected: " + clientId);
                    // Negotiate Screen
                    // Min dimensions
                    // For now, Host dictates its own size or min?
                    // "Game pixel size is the smaller of the two"
                    // We need to wait for client_hello to know client size though.
                });

                socket.on('client_hello', (data) => {
                    console.log("Client Hello:", data);
                    if (networkMode === 'HOST') {
                        const gameW = Math.min(window.innerWidth, data.w);
                        const gameH = Math.min(window.innerHeight, data.h);
                        // Send Config
                        socket.emit('server_screen_config', { w: gameW, h: gameH });
                        // Adjust Local
                        canvas.width = gameW; canvas.height = gameH;

                        // Share Host Sprites
                        shareSprites('PLAYER', playerId, shipImages);
                        // Share Enemy Sprites
                        shareSprites('ENEMY', 'ENEMY_GENERIC', enemyImages);

                        // Create Remote Player Entity local tracking
                        remotePlayer = { x: gameW / 2, y: gameH / 2, angle: 0, id: data.pid, hp: 100 };
                    }
                });

                socket.on('server_screen_config', (data) => {
                    if (networkMode === 'CLIENT') {
                        canvas.width = data.w;
                        canvas.height = data.h;
                        console.log("Screen Config Applied:", data);
                    }
                });

                socket.on('ship_sprite', (data) => {
                    // Receive Sprite
                    // Store in remoteShipImages? Or specific arrays?
                    // We need to store based on ID?
                    // Simplification: Client receives Host Ship & Enemy. Host receives Client Ship.
                    // We can just put them in dedicated arrays.
                    const img = new Image();
                    img.src = data.img;

                    if (data.role === 'PLAYER') {
                        if (!remoteShipImages[data.ship_id]) remoteShipImages[data.ship_id] = [];
                        remoteShipImages[data.ship_id][data.rot] = img;
                    } else if (data.role === 'ENEMY') {
                        // Overwrite local enemy images? 
                        // "the host's spaceship design needs to come into your screen... and enemy ship design files"
                        // So client uses Host's enemy images?
                        if (networkMode === 'CLIENT') {
                            enemyImages[data.rot] = img;
                        }
                    }
                });

                // --- GAME STATE SYNC ---
                socket.on('entity_move', (data) => {
                    // Host updates Client's world view
                    if (networkMode === 'CLIENT') {
                        if (data.type === 'HOST_PLAYER') {
                            if (!remotePlayer) remotePlayer = { x: 0, y: 0, angle: 0 };
                            // Interpolate or snap? Snap for now (30hz is okay)
                            // Data is delta? "Movements are specified as pixel offsets"
                            // "Host sends location and orientation" - wait, user said "Movements are specified as pixel offsets"
                            // But previously "position, velocity...".
                            // Let's stick to absolute pos for sync simplicity if possible, or deltas if required.
                            // User: "Movements are specified as pixel offsets scaled for 30 frames per second."
                            // Okay, let's treat data as ABSOLUTE position updates from Host, or actually Delta?
                            // "On the host-side, the behavior... is decided and sent to the client"
                            // Let's assume the payload contains x, y, angle.
                            remotePlayer.x = data.x;
                            remotePlayer.y = data.y;
                            remotePlayer.angle = data.angle;
                        } else if (data.type === 'ENEMY') {
                            // Find enemy by ID
                            let e = enemies.find(en => en.id === data.id);
                            if (!e) {
                                // Create if missing? Or wait for EntityCreate?
                                // It's safer to have EntityCreate.
                            } else {
                                e.x = data.x; e.y = data.y; e.angle = data.angle;
                            }
                        } else if (data.type === 'CLIENT_PLAYER') {
                            // Host telling Client where Client is?
                            // "For the client's side the behavior of the player ship only is sent." -> Client sends to Host.
                            // "EntityMove" comes from Host.
                            // Host is authoritative. It might correct Client.
                            // Let's ignore Client correction for smooth local feel, or apply it?
                            // Let's use it to correct drift.
                            if (Math.hypot(ship.x - data.x, ship.y - data.y) > 20) {
                                ship.x = data.x; ship.y = data.y;
                            }
                        }
                    }
                });

                socket.on('client_ship_move', (data) => {
                    if (networkMode === 'HOST' && remotePlayer) {
                        // Apply delta to remote player representation
                        // User: "Movements are specified as pixel offsets"
                        // So data has dx, dy?
                        // "ClientShipMove(entity_id, delta_x, delta_y, orientation)"
                        remotePlayer.x += data.dx;
                        remotePlayer.y += data.dy;
                        remotePlayer.angle = data.angle;

                        // Clamp
                        if (remotePlayer.x < 0) remotePlayer.x = 0; if (remotePlayer.x > canvas.width) remotePlayer.x = canvas.width;
                        if (remotePlayer.y < 0) remotePlayer.y = 0; if (remotePlayer.y > canvas.height) remotePlayer.y = canvas.height;
                    }
                });

                socket.on('entity_create', (data) => {
                    if (networkMode === 'CLIENT') {
                        if (data.type === 'ENEMY') {
                            const newEnemy = {
                                id: data.id,
                                x: data.x, y: data.y,
                                angle: data.angle,
                                isTurning: false,
                                hp: 30
                            };
                            enemies.push(newEnemy);
                        }
                    }
                });

                socket.on('entity_delete', (data) => {
                    if (networkMode === 'CLIENT') {
                        const idx = enemies.findIndex(e => e.id === data.id);
                        if (idx !== -1) {
                            // Explosion VFX triggers locally based on 'Ship Destroyed message' or just here?
                            // "triggered their own local explosion effect at same time"
                            // We should trigger explosion here.
                            const e = enemies[idx];
                            spawnParticles(e.x, e.y, 60, 'debris');
                            spawnParticles(e.x, e.y, 60, 'big_boom');
                            enemies.splice(idx, 1);
                        }
                    }
                });

                socket.on('weapon_fired', (data) => {
                    // "Both directions"
                    // Spawn projectile visually
                    // data: { x, y, angle, type, id }
                    if (data.type === 'LASER') {
                        // Just visual laser beam?
                        // "Laser speed = instantaneous"
                        // We show a beam.
                        // But we need to know source? Or just start point.
                        // Draw beam for one frame or add a "RemoteLaser" effect?
                        // Existing code draws laser based on "ship.laserActiveUntil".
                        // We can add a temporary visual object.
                        spawnRemoteLaser(data.x, data.y, data.angle);
                    } else if (data.type === 'TORPEDO') {
                        const rad = (data.angle - 90) * Math.PI / 180;
                        const dx = Math.cos(rad); const dy = Math.sin(rad);
                        // Add to local torpedo list?
                        // If Client, we add to torpedoes? 
                        // But torpedoes collision is logical.
                        // If Client, we just want to see it.
                        // We can add to a "visualTorpedoes" list or shared list but disable collision checks for Client?
                        // Host handles collision.
                        // Let's add with a flag `isRemote: true`.
                        torpedoes.push({
                            x: data.x + dx * 45, y: data.y + dy * 45,
                            dx: dx, dy: dy,
                            isRemote: true
                        });
                    }
                });

                socket.on('damage_event', (data) => {
                    if (networkMode === 'CLIENT') {
                        if (data.target === 'CLIENT_PLAYER') {
                            registerHit(data.angle || 0, data.wType, 0, 0); // Apply damage locally
                        }
                    }
                });
            }
            return true;
        }

        function startHost() {
            if (!initSocket()) return;
            const rid = roomIdInput.value || "ROOM1";
            socket.emit('host_game', rid);
        }

        function joinGame() {
            if (!initSocket()) return;
            const rid = roomIdInput.value || "ROOM1";
            socket.emit('join_game', rid);
        }

        function shareSprites(role, id, imageArray) {
            // Send all 16 rotations
            // Use timeout to avoid flooding?
            imageArray.forEach((img, idx) => {
                if (img.complete) {
                    // Create canvas to extract data
                    const tmpCan = document.createElement('canvas');
                    tmpCan.width = 90; tmpCan.height = 90;
                    const tCtx = tmpCan.getContext('2d');
                    tCtx.drawImage(img, 0, 0);
                    const dataUrl = tmpCan.toDataURL();
                    socket.emit('ship_sprite', {
                        role: role,
                        ship_id: id,
                        rot: idx,
                        img: dataUrl
                    });
                }
            });
        }

        let remoteLasers = [];
        function spawnRemoteLaser(x, y, angle) {
            remoteLasers.push({ x, y, angle, timer: 5 }); // show for 5 frames
        }

        const ammoFwdDisplay = document.getElementById('ammo-fwd');
        const ammoAftDisplay = document.getElementById('ammo-aft');
        const hullDisplay = document.getElementById('hull-val');
        const laserBar = document.getElementById('laser-bar');
        const alertMsg = document.getElementById('alert-msg');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- Game State ---
        const activeKeys = new Set();
        let lastTime = performance.now();
        let enemySpawnTimer = 0;
        let isGameOver = false;

        const ship = {
            x: window.innerWidth / 2,
            y: window.innerHeight / 2,
            angle: 0,
            targetAngle: 0,
            isTurning: false,

            // Health
            hull: 100,

            // Combat State
            laserCooldown: 0,
            laserActiveUntil: 0,
            torpedoAmmo: { front: 12, rear: 5 },

            // Modules Status (Timestamps for offline/glitch end)
            modules: {
                laserOffline: 0,
                torpFrontOffline: 0,
                torpRearOffline: 0,
                targetingGlitch: 0,
                engineDampened: 0
            },

            // Shield Data
            shield: {
                hits: [],
                sectors: { front: 100, back: 100, left: 100, right: 100 }
            }
        };

        const torpedoes = [];
        const enemies = [];
        const enemyProjectiles = [];
        const stars = [];

        // Bounce / Recoil State
        const bounceState = {
            active: false,
            vx: 0,
            vy: 0,
            timer: 0
        };

        // --- Starfield Generation ---
        for (let i = 0; i < STAR_COUNT; i++) {
            stars.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                size: Math.random() * 2 + 0.5,
                brightness: Math.random()
            });
        }

        // --- Image Preloading ---
        const shipImages = [];
        const enemyImages = [];

        for (let i = 0; i < 16; i++) {
            const img = new Image();
            const num = i.toString().padStart(2, '0');
            img.src = `spaceship_image/ship_${num}.png`;
            shipImages.push(img);
        }

        for (let i = 0; i < 16; i++) {
            const img = new Image();
            const num = i.toString().padStart(2, '0');
            img.src = `enemy_ships/enemy_ship${num}.png`;
            enemyImages.push(img);
        }

        // --- Enemy Logic ---
        function createEnemy(idOverride) {
            const side = Math.floor(Math.random() * 4);
            let x, y, initialAngle;
            const margin = 50;

            switch (side) {
                case 0: x = Math.random() * canvas.width; y = -margin; initialAngle = 135 + Math.random() * 90; break;
                case 1: x = canvas.width + margin; y = Math.random() * canvas.height; initialAngle = 225 + Math.random() * 90; break;
                case 2: x = Math.random() * canvas.width; y = canvas.height + margin; initialAngle = (315 + Math.random() * 90) % 360; break;
                case 3: x = -margin; y = Math.random() * canvas.height; initialAngle = 45 + Math.random() * 90; break;
            }

            const e = {
                id: idOverride || ('ENEMY_' + Math.random()),
                x: x, y: y,
                angle: initialAngle,
                targetAngle: initialAngle,
                nextTurnTime: performance.now() + 1000 + Math.random() * 2000,
                nextTorpedoTime: performance.now() + 5000 + Math.random() * 5000,
                nextLaserTime: performance.now() + 2000 + Math.random() * 2000,
                isLaserActive: false,
                laserEndTime: 0,
                isTurning: false,
                hp: 30 // Added HP for damage logic
            };

            if (networkMode === 'HOST') {
                socket.emit('entity_create', {
                    id: e.id, type: 'ENEMY', x: e.x, y: e.y, angle: e.angle
                });
            }
            return e;
        }

        // --- Input Handling ---
        const NUMPAD_MAP = {
            'Numpad8': 0, 'Numpad9': 45, 'Numpad6': 90, 'Numpad3': 135,
            'Numpad2': 180, 'Numpad1': 225, 'Numpad4': 270, 'Numpad7': 315
        };
        const NUMPAD_COMBOS = [
            { keys: ['Numpad8', 'Numpad9'], angle: 22.5 },
            { keys: ['Numpad6', 'Numpad9'], angle: 67.5 },
            { keys: ['Numpad3', 'Numpad6'], angle: 112.5 },
            { keys: ['Numpad2', 'Numpad3'], angle: 157.5 },
            { keys: ['Numpad1', 'Numpad2'], angle: 202.5 },
            { keys: ['Numpad1', 'Numpad4'], angle: 247.5 },
            { keys: ['Numpad4', 'Numpad7'], angle: 292.5 },
            { keys: ['Numpad7', 'Numpad8'], angle: 337.5 }
        ];
        const ARROW_MAP = { 'ArrowUp': 0, 'ArrowRight': 90, 'ArrowDown': 180, 'ArrowLeft': 270 };
        const ARROW_COMBOS = [
            { keys: ['ArrowUp', 'ArrowRight'], angle: 45 },
            { keys: ['ArrowRight', 'ArrowDown'], angle: 135 },
            { keys: ['ArrowDown', 'ArrowLeft'], angle: 225 },
            { keys: ['ArrowLeft', 'ArrowUp'], angle: 315 }
        ];

        window.addEventListener('keydown', (e) => {
            if (isGameOver) return;
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'ControlLeft', 'ControlRight'].includes(e.code) || e.code.startsWith('Numpad')) {
                e.preventDefault();
            }

            if (!activeKeys.has(e.code)) {
                if (e.key === 'Shift') firePlayerTorpedo(true);
                if (e.key === 'Control') firePlayerTorpedo(false);
                if (e.code === 'Space') firePlayerLaser();
            }

            activeKeys.add(e.code);
            updateInputState();
        });

        window.addEventListener('keyup', (e) => {
            if (isGameOver) return;
            activeKeys.delete(e.code);
            updateInputState();
        });

        function updateInputState() {
            let newAngle = null;
            let isNumpadActive = false;

            for (const key of activeKeys) {
                if (key.startsWith('Numpad') && /[1-9]/.test(key) && key !== 'Numpad5') {
                    isNumpadActive = true; break;
                }
            }
            if (isNumpadActive) {
                for (const combo of NUMPAD_COMBOS) {
                    if (activeKeys.has(combo.keys[0]) && activeKeys.has(combo.keys[1])) {
                        newAngle = combo.angle; break;
                    }
                }
                if (newAngle === null) {
                    for (const [code, angle] of Object.entries(NUMPAD_MAP)) {
                        if (activeKeys.has(code)) { newAngle = angle; break; }
                    }
                }
            } else {
                const hasArrow = Array.from(activeKeys).some(k => k.startsWith('Arrow'));
                if (hasArrow) {
                    for (const combo of ARROW_COMBOS) {
                        if (activeKeys.has(combo.keys[0]) && activeKeys.has(combo.keys[1])) {
                            newAngle = combo.angle; break;
                        }
                    }
                    if (newAngle === null) {
                        for (const [code, angle] of Object.entries(ARROW_MAP)) {
                            if (activeKeys.has(code)) { newAngle = angle; break; }
                        }
                    }
                }
            }

            if (newAngle !== null) {
                ship.targetAngle = newAngle; ship.isTurning = true;
            } else {
                ship.isTurning = false;
            }
        }

        function firePlayerTorpedo(isFront) {
            const now = performance.now();
            let deviation = 0;
            if (now < ship.modules.targetingGlitch) {
                deviation = (Math.random() - 0.5) * 40; // +/- 20 deg
            }

            if (isFront) {
                if (now < ship.modules.torpFrontOffline) return; // JAMMED
                if (ship.torpedoAmmo.front > 0) {
                    ship.torpedoAmmo.front--;
                    spawnTorpedo(0 + deviation);
                }
            } else {
                if (now < ship.modules.torpRearOffline) return; // JAMMED
                if (ship.torpedoAmmo.rear > 0) {
                    ship.torpedoAmmo.rear--;
                    spawnTorpedo(180 + deviation);
                }
            }
            // Network Notify
            if (isMultiplayer) {
                socket.emit('weapon_fired', {
                    type: 'TORPEDO',
                    x: ship.x, y: ship.y,
                    angle: ship.angle + (isFront ? 0 : 180) + deviation, // approx
                    id: 'TORP_' + Math.random()
                });
            }
            updateUI();
        }

        function spawnTorpedo(angleOffset) {
            const rad = (ship.angle - 90 + angleOffset) * Math.PI / 180;
            const dx = Math.cos(rad); const dy = Math.sin(rad);
            torpedoes.push({
                x: ship.x + dx * 45, y: ship.y + dy * 45, dx: dx, dy: dy, isRemote: false
            });
        }

        function firePlayerLaser() {
            const now = performance.now();
            if (now < ship.modules.laserOffline) return; // JAMMED

            if (now >= ship.laserCooldown) {
                ship.laserActiveUntil = now + 500;
                ship.laserCooldown = now + 10000;

                if (isMultiplayer) {
                    socket.emit('weapon_fired', {

                    });

        function updateUI() {
            ammoFwdDisplay.innerText = ship.torpedoAmmo.front.toString().padStart(2, '0');
            ammoAftDisplay.innerText = ship.torpedoAmmo.rear.toString().padStart(2, '0');
            hullDisplay.innerText = Math.ceil(ship.hull);

            if (ship.hull < 30) hullDisplay.style.color = '#ff0000';
            else if (ship.hull < 60) hullDisplay.style.color = '#ffaa00';
            else hullDisplay.style.color = 'rgba(255, 255, 255, 0.4)';

            // Status Alert
            const now = performance.now();
            if (now < ship.modules.engineDampened || now < ship.modules.laserOffline || now < ship.modules.torpFrontOffline || now < ship.modules.torpRearOffline || now < ship.modules.targetingGlitch) {

                if (now < ship.modules.torpRearOffline) msg.push("REAR TORP JAMMED");

                alertMsg.innerText = msg.join(" | ");
            } else {
                alertMsg.style.display = 'none';
            }
        }

        function updateRotation(entity, dt) {
            let diff = entity.targetAngle - entity.angle;
            while (diff <= -180) diff += 360;
            while (diff > 180) diff -= 360;
            if (entity.isTurning) {
                const maxRot = ROTATION_SPEED * dt;
                if (Math.abs(diff) <= maxRot) { entity.angle = entity.targetAngle; }
                else { entity.angle += Math.sign(diff) * maxRot; }
                entity.angle = (entity.angle + 360) % 360;
            }
        }

        function moveForward(entity, dt) {
            let speed = MOVEMENT_SPEED;
            if (entity === ship) {
                if (performance.now() < ship.modules.engineDampened) {
                    speed *= 0.5; // Engine Dampened
                }
            }

            const rad = (entity.angle - 90) * Math.PI / 180;
            const dx = Math.cos(rad) * speed * dt;
            const dy = Math.sin(rad) * speed * dt;

            entity.x += dx;
            entity.y += dy;

            if (isMultiplayer && networkMode === 'CLIENT' && entity === ship) {
                // Send Delta
                socket.emit('client_ship_move', { dx: dx, dy: dy, angle: ship.angle });
            }
        }

        function checkCollision(x1, y1, r1, x2, y2, r2) {
            return Math.hypot(x2 - x1, y2 - y1) < (r1 + r2);
        }

        // Handle Damage


        function applySystemFailure(sector) {
            const now = performance.now();
            const hullFactor = (100 - ship.hull) / 100; // 0 to 1
            const duration = 5000 + 25000 * hullFactor; // 5s to 30s

            if (sector === 'front') {
                if (Math.random() < 0.5) {
                    // JAM BOTH FRONT WEAPONS
                    ship.modules.laserOffline = now + duration;
                    ship.modules.torpFrontOffline = now + duration;
                }
                else ship.modules.targetingGlitch = now + duration;
            } else if (sector === 'back') {
                if (Math.random() < 0.5) ship.modules.torpRearOffline = now + duration;
                else ship.modules.targetingGlitch = now + duration;
            } else if (sector === 'left' || sector === 'right') {
                ship.modules.engineDampened = now + duration;
            }
        }

        // --- Particle System ---
        class Particle {
            constructor(x, y, type) {
                this.x = x; this.y = y; this.type = type;
                this.vx = (Math.random() - 0.5) * 50;
                this.vy = (Math.random() - 0.5) * 50;
                this.life = 1.0;
                this.color = '#fff';
                this.size = 2;

                // --- NEW VFX TYPES ---
                if (type === 'glow') {
                    // Laser vs Shield: Small diffuse spheroid glow
                    this.vx = 0; this.vy = 0;
                    this.life = 0.2;
                    this.size = 20; // Slightly larger but soft
                    this.color = '0, 255, 255'; // Cyan glow
                }
                else if (type === 'small_boom') {
                    // Torpedo vs Shield: Small explosion
                    this.vx = (Math.random() - 0.5) * 150;
                    this.vy = (Math.random() - 0.5) * 150;
                    this.life = 0.4;
                    this.size = 3 + Math.random() * 4;
                    this.color = `255, ${150 + Math.random() * 50}, 0`; // Orange-ish
                }
                else if (type === 'spark') {
                    // Laser vs Hull: Sparkler effect (fast, bright, small area)
                    this.vx = (Math.random() - 0.5) * 400;
                    this.vy = (Math.random() - 0.5) * 400;
                    this.life = 0.3 + Math.random() * 0.3;
                    this.size = 1.5 + Math.random() * 1.5;
                    this.color = `255, ${240 + Math.random() * 15}, ${150 + Math.random() * 50}`; // White-Hot Yellow
                }
                else if (type === 'big_boom') {
                    // Torpedo vs Hull: Larger explosion
                    this.vx = (Math.random() - 0.5) * 250;
                    this.vy = (Math.random() - 0.5) * 250;
                    this.life = 0.8;
                    this.size = 6 + Math.random() * 8;
                    this.color = `255, ${50 + Math.random() * 100}, 0`; // Red-Orange
                }
                else if (type === 'debris') {
                    // Ship Destruction: Full Computed Explosion
                    this.vx = (Math.random() - 0.5) * 350;
                    this.vy = (Math.random() - 0.5) * 350;
                    this.life = 1.0 + Math.random() * 1.5;
                    this.size = 2 + Math.random() * 4;
                    this.color = '200, 200, 200';
                }
                // Legacy support or extra fire
                else if (type === 'med_boom') {
                    this.vx = (Math.random() - 0.5) * 200;
                    this.vy = (Math.random() - 0.5) * 200;
                    this.life = 0.6;
                    this.size = 5 + Math.random() * 5;
                    this.color = '255, 100, 0';
                }
            }
            update(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                this.life -= dt;
            }
        }
        const particles = [];

        function spawnParticles(x, y, count, type) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, type));
            }
        }

        // --- Game Update ---
        function update(dt) {
            if (isGameOver && ship.hull <= 0) return; // Stop updates only after game over confirmed logic
            const now = performance.now();

            // Note: Particles are now updated in the loop() function to persist after death.
            // Old loop removed from here.

            let cdRem = Math.max(0, ship.laserCooldown - now);
            let pct = ((10000 - cdRem) / 10000) * 100;
            if (now < ship.laserCooldown) {
                laserBar.style.width = pct + '%';
                laserBar.style.backgroundColor = '#666';
            } else {
                laserBar.style.width = '100%';
                laserBar.style.backgroundColor = '#00ffff';
            }

            if (now > ship.modules.laserOffline && now < ship.modules.laserOffline + 100) updateUI();

            // 0. Spawning (HOST ONLY)
            if (networkMode !== 'CLIENT') {
                enemySpawnTimer += dt * 1000;
                if (enemies.length < ENEMY_MAX_COUNT && enemySpawnTimer > ENEMY_SPAWN_RATE) {
                    enemies.push(createEnemy());
                    enemySpawnTimer = 0;
                }
            }

            // 1. Player
            if (ship.hull > 0) {
                updateRotation(ship, dt);
                moveForward(ship, dt);
                if (ship.x < 0) ship.x = 0; if (ship.x > canvas.width) ship.x = canvas.width;
                if (ship.y < 0) ship.y = 0; if (ship.y > canvas.height) ship.y = canvas.height;
            }

            // Shield Decay
            const sHits = ship.shield.hits;
            for (let i = sHits.length - 1; i >= 0; i--) {
                sHits[i].intensity -= SHIELD_DECAY * dt;
                if (sHits[i].intensity <= 0) sHits.splice(i, 1);
            }

            // Network Sync (OUTGOING)
            if (isMultiplayer) {
                if (networkMode === 'CLIENT') {
                    // Send Client Moves
                    // Calc Delta?
                    // User said "movements are specified as pixel offsets"
                    // We can just send current pos relative to last pos?
                    // Let's just send Move packet.
                    // Actually, if we just send ClientShipMove with dx/dy from moveForward input?
                    // But we don't have input dx/dy easily available here (computed inside moveForward).
                    // We can check delta position
                    // For simplicity, let's send absolute position updates if allowed, OR refactor moveForward.
                    // Implementation: Just move local, then send "ClientShipMove" with dx=0, dy=0 but correct Angle/Pos?
                    // Wait, user said "Movements are specified as pixel offsets".
                    // I'll adhere to sending my input-based movement?
                    // Let's send the ACTUAL movement that happened this frame.
                    // ... Actually, easier: we are Client. We just moved. Send our Pos/Angle?
                    // "ClientShipMove... delta_x... delta_y"
                    // The Host integrates it.
                    // But if I move local, I am authoritative for my inputs.
                    // I will send my current Pos? No, the protocol asks for delta.
                    // I will deduce delta from last frame.
                    // ... Or simply, send "input status" and let host sim?
                    // Protocol: ClientShipMove(dx, dy, angle).
                } else if (networkMode === 'HOST') {
                    // Send EntityMoves
                    // Host Ship
                    socket.emit('entity_move', { type: 'HOST_PLAYER', x: ship.x, y: ship.y, angle: ship.angle });
                    // Remote Player (Client) - Re-broadcast authoritative?
                    if (remotePlayer) {
                        socket.emit('entity_move', { type: 'CLIENT_PLAYER', x: remotePlayer.x, y: remotePlayer.y, angle: remotePlayer.angle });
                    }
                    // Enemies
                    enemies.forEach(e => {
                        socket.emit('entity_move', { type: 'ENEMY', id: e.id, x: e.x, y: e.y, angle: e.angle });
                    });
                }
            }

            // Handle Bounce Push
            if (bounceState.active) {
                ship.x += bounceState.vx;
                ship.y += bounceState.vy;
                bounceState.timer--;
                if (bounceState.timer <= 0) bounceState.active = false;
            }

            // 2. Enemy
            for (let k = enemies.length - 1; k >= 0; k--) {
                const enemy = enemies[k];
                if (now > enemy.nextTurnTime) {
                    enemy.targetAngle = Math.random() * 360;
                    enemy.isTurning = true;
                    enemy.nextTurnTime = now + 1000 + Math.random() * 2000;
                }
                if (now > enemy.nextTorpedoTime) {
                    const angle = Math.atan2(ship.y - enemy.y, ship.x - enemy.x);
                    const dx = Math.cos(angle), dy = Math.sin(angle);
                    enemyProjectiles.push({ x: enemy.x + dx * 45, y: enemy.y + dy * 45, dx: dx, dy: dy });
                    enemy.nextTorpedoTime = now + 5000 + Math.random() * 5000; // Reset timer
                }
                if (!enemy.isLaserActive && now > enemy.nextLaserTime) {
                    enemy.isLaserActive = true;
                    enemy.laserEndTime = now + 1000;
                    enemy.nextLaserTime = now + 2500 + Math.random() * 2000;
                }
                if (enemy.isLaserActive && now > enemy.laserEndTime) {
                    enemy.isLaserActive = false;
                }
                if (networkMode !== 'CLIENT') {
                    updateRotation(enemy, dt);
                    moveForward(enemy, dt);
                } else {
                    // Client just interpolates/draws, no logic update?
                    // If we rely on EntityMove, we don't move them here using logic.
                }

                let hitWall = false;
                if (enemy.x <= 0) { enemy.x = 0; hitWall = true; enemy.targetAngle = 45 + Math.random() * 90; }
                else if (enemy.x >= canvas.width) { enemy.x = canvas.width; hitWall = true; enemy.targetAngle = 225 + Math.random() * 90; }
                if (enemy.y <= 0) { enemy.y = 0; hitWall = true; enemy.targetAngle = 135 + Math.random() * 90; }
                else if (enemy.y >= canvas.height) { enemy.y = canvas.height; hitWall = true; enemy.targetAngle = (315 + Math.random() * 90) % 360; }
                if (hitWall) { enemy.isTurning = true; enemy.nextTurnTime = now + 1000; }

                // Ship vs Enemy Collision Check
                if (ship.hull > 0 && Math.hypot(ship.x - enemy.x, ship.y - enemy.y) < 70) { // 35+35 radius approx
                    // COLLISION!
                    // Both take high laser damage (which is 5 in current logic, maybe scale up)
                    // Requirement: "damage equal to the high value of the a laser blast" -> let's say 10 to be safe

                    // Damage Player
                    registerHit(Math.atan2(enemy.y - ship.y, enemy.x - ship.x), 'collision_laser', ship.x, ship.y);

                    // Damage Enemy
                    enemy.hp -= 10;
                    spawnParticles(enemy.x, enemy.y, 10, 'spark');
                    if (enemy.hp <= 0) {
                        spawnParticles(enemy.x, enemy.y, 60, 'debris');
                        spawnParticles(enemy.x, enemy.y, 40, 'big_boom');
                        spawnParticles(enemy.x, enemy.y, 30, 'spark');
                        enemies.splice(k, 1);
                    }

                    // Bounce Logic for Player
                    // direction of impact FROM enemy TO player = atan2(ship.y - enemy.y ...)
                    // Push away direction = same angle
                    const angle = Math.atan2(ship.y - enemy.y, ship.x - enemy.x) * 180 / Math.PI;
                    // Round to nearest 22.5
                    const roundedAngle = Math.round(angle / 22.5) * 22.5;
                    const rad = roundedAngle * Math.PI / 180;

                    bounceState.active = true;
                    bounceState.vx = Math.cos(rad) * 5; // 5 px per tick
                    bounceState.vy = Math.sin(rad) * 5;
                    bounceState.timer = 7; // 7 ticks

                    // For enemy, we can just push them manually or let them slide
                    // Requirement: "both ships bounce". Enemy update is simple directly here.
                    const enemyRevAngle = roundedAngle + 180;
                    const eRad = enemyRevAngle * Math.PI / 180;
                    enemy.x += Math.cos(eRad) * 5 * 7; // Instant push for enemy simplification or state?
                    // Let's just push them a bit instant for now or they might look weird.
                    // Or ideally give them a bounce state too. But structure is array.
                    // Let's simpler: push them 35px away instantly to separate.
                    enemy.x += Math.cos(eRad) * 35;
                    enemy.y += Math.sin(eRad) * 35;
                }
            }

            // 3. Player Torpedoes vs Enemies
            for (let i = torpedoes.length - 1; i >= 0; i--) {
                const t = torpedoes[i];
                t.x += t.dx * TORPEDO_SPEED * dt;
                t.y += t.dy * TORPEDO_SPEED * dt;

                // Bounds check
                if (t.x < 0 || t.x > canvas.width || t.y < 0 || t.y > canvas.height) { torpedoes.splice(i, 1); continue; }

                if (t.isRemote) continue; // Remote torpedoes don't check collision here (Host does or Owner does)

                // Check collisions (HOST ONLY for game state)
                if (networkMode !== 'CLIENT') {
                    for (let j = enemies.length - 1; j >= 0; j--) {
                        if (checkCollision(t.x, t.y, 5, enemies[j].x, enemies[j].y, 40)) {
                            // HIT ENEMY
                            enemies[j].hp -= 20; // Torpedo Damage high
                            if (enemies[j].hp <= 0) {
                                spawnParticles(enemies[j].x, enemies[j].y, 60, 'debris');
                                spawnParticles(enemies[j].x, enemies[j].y, 40, 'big_boom');
                                if (isMultiplayer) socket.emit('entity_delete', { id: enemies[j].id });
                                enemies.splice(j, 1);
                            } else {
                                // Enemy No Shield -> Hull Explosion
                                spawnParticles(t.x, t.y, 15, 'big_boom');
                            }
                            torpedoes.splice(i, 1); break;
                        }
                    }
                    // Check Collision with Remote Player (Host vs Client)
                    if (networkMode === 'HOST' && remotePlayer) {
                        if (checkCollision(t.x, t.y, 5, remotePlayer.x, remotePlayer.y, 40)) {
                            // Hit Remote Player
                            socket.emit('damage_event', { target: 'CLIENT_PLAYER', wType: 'torpedo' });
                            spawnParticles(t.x, t.y, 8, 'small_boom'); // Visual on Host
                            torpedoes.splice(i, 1);
                        }
                    }
                }
            }

            // 4. Enemy Projectiles vs Player
            for (let i = enemyProjectiles.length - 1; i >= 0; i--) {
                const p = enemyProjectiles[i];
                p.x += p.dx * ENEMY_PROJECTILE_SPEED * dt;
                p.y += p.dy * ENEMY_PROJECTILE_SPEED * dt;

                if (p.x < 0 || p.x > canvas.width || p.y < 0 || p.y > canvas.height) {
                    enemyProjectiles.splice(i, 1); continue;
                }

                const distToShip = Math.hypot(p.x - ship.x, p.y - ship.y);
                if (distToShip < SHIELD_RADIUS) {
                    const angle = Math.atan2(p.y - ship.y, p.x - ship.x);
                    // Check if shield actually catches it based on sector health
                    // We need to look ahead at registerHit logic or pass type
                    registerHit(angle, 'torpedo', p.x, p.y);
                    enemyProjectiles.splice(i, 1);
                }
            }

            // 6. Player Laser Collision
            if (now < ship.laserActiveUntil) {
                const rad = (ship.angle - 90) * Math.PI / 180;
                const noseX = ship.x + Math.cos(rad) * 45;
                const noseY = ship.y + Math.sin(rad) * 45;
                const laserDirX = Math.cos(rad); const laserDirY = Math.sin(rad);

                for (let j = enemies.length - 1; j >= 0; j--) {
                    const e = enemies[j];
                    const toEnemyX = e.x - noseX; const toEnemyY = e.y - noseY;
                    const dp = toEnemyX * laserDirX + toEnemyY * laserDirY;
                    if (dp > 0) {
                        const closeX = noseX + laserDirX * dp;
                        const closeY = noseY + laserDirY * dp;
                        if (Math.hypot(e.x - closeX, e.y - closeY) < 30) {
                            // HIT ENEMY
                            if (Math.random() < 0.3) { // Increased hit chance/tick (was 0.2)
                                e.hp -= 5; // Increased Damage (was 2)
                                spawnParticles(closeX, closeY, 3, 'spark'); // Hull Sparks
                                if (e.hp <= 0) {
                                    // Enemy Destruction
                                    spawnParticles(e.x, e.y, 60, 'debris'); // More Debris
                                    spawnParticles(e.x, e.y, 40, 'med_boom'); // More Fire
                                    spawnParticles(e.x, e.y, 20, 'spark'); // Add Sparks
                                    enemies.splice(j, 1);
                                }
                            }
                        }
                    }
                }
            }
            countDisplay.innerText = enemies.length;
        }

        // --- Modified RegisterHit ---
        function registerHit(impactAngle, type, hitX, hitY) {
            if (ship.hull <= 0 && type !== 'collision_laser') return; // Allow collision damage to kill?

            const shipRad = (ship.angle - 90) * Math.PI / 180;
            let rel = impactAngle - shipRad;
            while (rel <= -Math.PI) rel += Math.PI * 2;
            while (rel > Math.PI) rel -= Math.PI * 2;
            const relDeg = rel * 180 / Math.PI;

            let sector = 'front';
            if (relDeg >= 45 && relDeg < 135) sector = 'right';
            else if (relDeg >= -135 && relDeg < -45) sector = 'left';
            else if (relDeg >= 135 || relDeg < -135) sector = 'back';

            // Special case for Collision: it ignores shield? Or treats as hull hit?
            // "When two ships collide, both take damage equal to the high value of the a laser blast... and both bounce"
            // Usually internal collisions happen under shields? Let's assume hitting shield if it's up?
            // "In addition, both the lasers and the torpedoes can hit the ship if the shields are down. In that case... burn into metal"
            // Let's assume collision damages HULL directly or checks shield? 
            // The prompt says "damage equal to... laser blast".
            // Let's assume it attempts to hit shield first.

            if (type !== 'collision_laser' && ship.shield.sectors[sector] > 0) {
                // Shield Absorbs
                const dmg = (type === 'torpedo') ? 25 : 0.5; // Torp does more shield dmg
                ship.shield.sectors[sector] = Math.max(0, ship.shield.sectors[sector] - dmg);

                // VFX: Shield Hit
                if (!isNaN(impactAngle)) {
                    ship.shield.hits.push({ angle: impactAngle, intensity: 1.2, color: getSectorColor(ship.shield.sectors[sector]) });
                }

                // Specific VFX per weapon on Shield
                const px = ship.x + Math.cos(impactAngle) * SHIELD_RADIUS;
                const py = ship.y + Math.sin(impactAngle) * SHIELD_RADIUS;

                if (type === 'torpedo') spawnParticles(px, py, 8, 'small_boom'); // Torpedo vs Shield
                else spawnParticles(px, py, 1, 'glow'); // Laser vs Shield (Glow)

            } else {
                // Hull Damage
                let dmg = 0;
                if (type === 'torpedo') dmg = 15;
                else if (type === 'laser') dmg = 1;
                else if (type === 'collision_laser') dmg = 10; // High laser damage

                if (sector === 'left' || sector === 'right') dmg *= 2;

                ship.hull -= dmg;

                // VFX: Hull Hit
                const px = ship.x + Math.cos(impactAngle) * 45; // Approx hull surface
                const py = ship.y + Math.sin(impactAngle) * 45;

                if (type === 'torpedo') {
                    spawnParticles(px, py, 20, 'big_boom'); // Torpedo vs Hull: Big Explosion
                }
                else if (type === 'laser' || type === 'collision_laser') {
                    spawnParticles(px, py, 10, 'spark'); // Laser vs Hull: Sparkler
                }

                if (ship.hull <= 0) {
                    ship.hull = 0;
                    isGameOver = true;
                    // Explosion VFX - Full Ship Destruction
                    spawnParticles(ship.x, ship.y, 80, 'debris');
                    spawnParticles(ship.x, ship.y, 60, 'big_boom');
                    spawnParticles(ship.x, ship.y, 50, 'spark');
                    setTimeout(() => {
                        document.getElementById('game-over-screen').style.display = 'flex';
                    }, 2000);
                }
                applySystemFailure(sector);
            }
            updateUI();
        }

        function getSectorColor(hp) {
            if (hp > 75) return '0, 255, 0';
            if (hp > 50) return '255, 255, 0';
            if (hp > 25) return '255, 128, 0';
            return '255, 0, 0';
        }

        function drawParticles() {
            for (const p of particles) {
                ctx.globalAlpha = p.life;
                if (p.type === 'glow') {
                    // Glow is diffuse
                    const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
                    grad.addColorStop(0, `rgba(${p.color}, ${p.life})`);
                    grad.addColorStop(1, `rgba(${p.color}, 0)`);
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillStyle = `rgba(${p.color}, ${p.life})`;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            ctx.globalAlpha = 1.0;
        }

        function drawEntity(entity, imgArray) {
            if (!imgArray) return;
            let index = Math.round(((360 - entity.angle) % 360) / 22.5);
            index = index % 16;
            // Handle array bounds or map?
            // The image arrays are standard 0..15?
            // If it's a map (remoteShipImages), it might be sparse?
            // "ShipSprite... rotation_index... 0, 1, 2"
            // We store in array/object.
            const img = imgArray[index];
            if (img && img.complete) {
                ctx.drawImage(img, entity.x - 45, entity.y - 45, 90, 90);
            }
        }

        function drawShield() {
            if (ship.shield.hits.length === 0) return;

            ctx.save();
            ctx.beginPath();
            ctx.arc(ship.x, ship.y, SHIELD_RADIUS, 0, Math.PI * 2);
            ctx.clip();

            ctx.fillStyle = 'rgba(0, 255, 255, 0.05)';
            ctx.fill();

            for (const hit of ship.shield.hits) {
                const intensity = hit.intensity;
                if (intensity <= 0) continue;

                const hitX = ship.x + Math.cos(hit.angle) * SHIELD_RADIUS;
                const hitY = ship.y + Math.sin(hit.angle) * SHIELD_RADIUS;

                if (!isNaN(hitX) && !isNaN(hitY)) {
                    const grad = ctx.createRadialGradient(hitX, hitY, 0, hitX, hitY, 50);
                    const colStr = hit.color || '0, 255, 255';

                    grad.addColorStop(0, `rgba(255, 255, 255, ${intensity})`);
                    grad.addColorStop(0.3, `rgba(${colStr}, ${intensity * 0.8})`);
                    grad.addColorStop(1, `rgba(${colStr}, 0)`);

                    ctx.fillStyle = grad;
                    ctx.fillRect(ship.x - SHIELD_RADIUS, ship.y - SHIELD_RADIUS, SHIELD_RADIUS * 2, SHIELD_RADIUS * 2);
                }
            }

            ctx.strokeStyle = `rgba(0, 255, 255, 0.3)`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(ship.x, ship.y, SHIELD_RADIUS - 1, 0, Math.PI * 2);
            ctx.stroke();

            ctx.restore();
        }

        function draw() {
            const now = performance.now();
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Stars
            ctx.fillStyle = '#ffffff';
            for (const s of stars) {
                ctx.globalAlpha = s.brightness;
                ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2); ctx.fill();
            }
            ctx.globalAlpha = 1.0;

            drawParticles(); // Draw VFX

            // Only draw game entities if NOT game over (or maybe keep drawing debris?)
            // We want to see the explosion, so we keep drawing everything until the overlay covers it?
            // Actually, if we stop updating entities, they freeze. We should keep drawing particles.

            if (!isGameOver) {
                // Player Torpedoes
                ctx.fillStyle = '#ffcc00'; ctx.strokeStyle = '#ff4400';
                for (const t of torpedoes) {
                    ctx.beginPath(); ctx.arc(t.x, t.y, 3, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                }

                // Enemy Projectiles
                ctx.fillStyle = '#ff0000'; ctx.strokeStyle = '#ff8888';
                for (const p of enemyProjectiles) {
                    ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                }

                // Enemy Lasers
                for (const e of enemies) {
                    if (e.isLaserActive) {
                        // ... draw laser ...
                        const rad = (e.angle - 90) * Math.PI / 180;
                        const noseX = e.x + Math.cos(rad) * 45;
                        const noseY = e.y + Math.sin(rad) * 45;
                        let drawLen = 1000;
                        const laserDirX = Math.cos(rad); const laserDirY = Math.sin(rad);

                        // Raycast Collision Check
                        const toShipX = ship.x - noseX; const toShipY = ship.y - noseY;
                        const t = toShipX * laserDirX + toShipY * laserDirY;
                        const closestX = noseX + t * laserDirX;
                        const closestY = noseY + t * laserDirY;
                        const distSq = (closestX - ship.x) ** 2 + (closestY - ship.y) ** 2;

                        if (distSq < SHIELD_RADIUS ** 2 && t > 0) {
                            const dt = Math.sqrt(SHIELD_RADIUS ** 2 - distSq);
                            const tIntersect = t - dt;
                            if (tIntersect > 0 && tIntersect < drawLen) {
                                if (ship.shield.sectors.front > 0 || ship.shield.sectors.back > 0 || ship.shield.sectors.left > 0 || ship.shield.sectors.right > 0) {
                                    drawLen = tIntersect;
                                    if (networkMode !== 'CLIENT' && Math.random() < 0.2) {
                                        const hitAngle = Math.atan2((noseY + laserDirY * tIntersect) - ship.y, (noseX + laserDirX * tIntersect) - ship.x);
                                        registerHit(hitAngle, 'laser', 0, 0);
                                    }
                                }
                            }
                        }

                        const endX = noseX + laserDirX * drawLen;
                        const endY = noseY + laserDirY * drawLen;
                        ctx.strokeStyle = '#ff0000'; ctx.lineWidth = 2;
                        ctx.beginPath(); ctx.moveTo(noseX, noseY); ctx.lineTo(endX, endY); ctx.stroke();
                        ctx.shadowBlur = 5; ctx.shadowColor = '#ff0000'; ctx.stroke(); ctx.shadowBlur = 0;
                    }
                }

                // Enemies
                for (const e of enemies) {
                    drawEntity(e, enemyImages);
                }

                // Remote Player
                if (remotePlayer) {
                    // Decide which image to use
                    // If shared exists
                    let imgs = shipImages; // Fallback
                    if (networkMode === 'HOST' && remoteShipImages[remotePlayer.id]) imgs = remoteShipImages[remotePlayer.id];
                    else if (networkMode === 'CLIENT' && remoteShipImages['PLAYER_HOST']) imgs = remoteShipImages['PLAYER_HOST']; // Assuming ID?

                    // Actually we need to track ID correctly.
                    // For now, Host draws Client using `remotePlayer.id` images.
                    // Client draws Host?
                    // The Host sends `entity_move` with `type: 'HOST_PLAYER'`.
                    // Client needs to render that.
                    // We need a `hostPlayerEntity` on Client side.
                    // Currently `remotePlayer` on Host is Client.
                    // On Client, we should have a `remotePlayer` (Host).
                    // Logic already sets `remotePlayer` on Client when receiving `HOST_PLAYER` move.

                    drawEntity(remotePlayer, (remoteShipImages[remotePlayer.id] || shipImages));
                }

                // Remote Lasers
                ctx.strokeStyle = '#ff00ff'; ctx.lineWidth = 3;
                let rlIdx = remoteLasers.length;
                while (rlIdx--) {
                    const l = remoteLasers[rlIdx];
                    const lx = l.x + Math.cos(l.angle * Math.PI / 180) * 2000;
                    const ly = l.y + Math.sin(l.angle * Math.PI / 180) * 2000;
                    ctx.beginPath(); ctx.moveTo(l.x, l.y); ctx.lineTo(lx, ly); ctx.stroke();
                    l.timer--;
                    if (l.timer <= 0) remoteLasers.splice(rlIdx, 1);
                }

                // Player Ship (Don't draw if destroyed? Or just let it be covered by explosion)
                if (ship.hull > 0) drawEntity(ship, shipImages);
                if (ship.hull > 0) drawShield();

                // Player Laser
                if (now < ship.laserActiveUntil) {
                    const rad = (ship.angle - 90) * Math.PI / 180;
                    const noseX = ship.x + Math.cos(rad) * 45;
                    const noseY = ship.y + Math.sin(rad) * 45;
                    const endX = noseX + Math.cos(rad) * 2000;
                    const endY = noseY + Math.sin(rad) * 2000;
                    ctx.strokeStyle = '#22aaff'; ctx.lineWidth = 4;
                    ctx.beginPath(); ctx.moveTo(noseX, noseY); ctx.lineTo(endX, endY); ctx.stroke();
                    ctx.shadowBlur = 15; ctx.shadowColor = '#ffffff'; ctx.stroke(); ctx.shadowBlur = 0;
                }
            }
        }

        function loop(timestamp) {
            const dt = (timestamp - lastTime) / 1000;
            lastTime = timestamp;

            // ALWAYS update particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update(dt);
                if (p.life <= 0) particles.splice(i, 1);
            }

            if (!isGameOver) {
                update(dt);
            }
            draw(); // Always draw to show particles fading out

            // Stop loop ONLY if game over AND particles are gone? No, just keep running until overlay.
            // Actually, requestAnimationFrame should keep running for VFX.
            // But we don't want to update game logic (move ship etc) if game over.

            requestAnimationFrame(loop);
        }

        requestAnimationFrame(loop);

    </script>
